name: Science

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kernel
        run: python -m pip install -e ".[dev]"
      - name: Plugin mirrors
        run: python scripts/sync_plugin.py --check
      - name: Package Workbench extension
        run: python scripts/package_extension.py
      - name: Pytest
        run: python -m pytest
      - name: Experiments
        run: python -m veyra test examples
